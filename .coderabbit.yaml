# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
# CodeRabbit PR reviews. The rules below are CONTRIBUTING.md's, per path.
language: en-US
tone_instructions: "Plain and short. appzones is a sandbox: first ask whether a change makes a zone easier to escape or lets it see more of the host."

reviews:
  profile: chill
  high_level_summary: true
  # in the walkthrough comment, never in the PR description (squash commits must stay free of it)
  high_level_summary_in_walkthrough: true
  poem: false
  review_status: true
  collapse_walkthrough: true
  auto_review:
    enabled: true
    drafts: false
  path_filters:
    - "!flake.lock"
    - "!docs/demo-*.gif"
    - "!docs/demo-*.cast"
    - "!assets/**/*.svg"
    - "!assets/**/*.png"
  path_instructions:
    - path: "helper/src/mount_helper*.rs"
      instructions: |
        Runs as root through sudo, as its own binary (mount_helper.rs; the code
        is in mount_helper_linux.rs). Check that it reads no environment but
        SUDO_UID, trusts only SUDO_UID for the caller, mounts only under the
        caller's appzones/*/mnt, and is safe against symlink swaps and races
        between checking a path and using it (fds, O_NOFOLLOW). unsafe only in
        `mod sys`. It should stay small; flag anything that grows its surface.
    - path: "helper/src/{config,policy}.rs"
      instructions: |
        The schema, the validator and the never-lists. Never-lists (paths,
        D-Bus names, environment) only grow: flag any removal. A new config key
        or value needs RELEASE bumped, an entry in SINCE, a test, and docs in
        docs/configuration/reference.md and examples/zones.toml. Malformed
        values must be errors, never a panic. settings_hash must stay byte for
        byte what it was (helper/tests/golden).
    - path: "helper/src/{cli,plan,serve,netsetup,agent,active,host_dns}.rs"
      instructions: |
        The commands (cli.rs), the server (serve.rs), the zone's plan and its
        bubblewrap command line (plan.rs), the network (netsetup.rs, host_dns.rs).
        Flag anything that gives a zone more: new binds, sockets, environment
        variables, D-Bus names, devices or capabilities. Binds are pinned by fd
        (--bind-fd) and checked after opening; zone-init's socket is made by the
        host; keep both. Messages are part of the interface (tests grep them).
    - path: "helper/src/{zone_init,zone_dns,open_link}.rs"
      instructions: |
        Runs inside the zone (zone-init is PID 2 under bwrap) and serves the
        control socket. Treat everything arriving on the socket as untrusted input.
    - path: "helper/src/project.rs"
      instructions: |
        A repository's appzones.toml is someone else's input. Nothing of it is
        used before `appzones trust`; zones run from the trusted copy, never the
        repo's file; only the keys in PROJECT_KEYS; no devices, Wayland or host
        D-Bus. Flag anything that widens that.
    - path: "helper/src/{seatbelt,proxy}.rs"
      instructions: |
        macOS zones. The Seatbelt profile starts from (deny default): flag every
        new allow (files, network, mach-lookup, sysctl). The proxy must never
        reach the host, its networks, private, CGNAT, link-local or multicast
        ranges, and must check the address it connects to (no second lookup).
    - path: "helper/src/sys.rs"
      instructions: |
        System calls Linux and macOS spell differently. Each unsafe block has a
        `// Safety:` line; behaviour must be the same on both, or say where not.
    - path: "helper/src/zone_wayland.rs"
      instructions: |
        The wp_security_context_v1 helper. A failure must close the zone's
        access, never fall back to the host's socket.
    - path: "helper/tests/golden/*.json"
      instructions: |
        What the Python implementation answered. An answer changes only on
        purpose, in the same PR as the code, with the reason stated.
    - path: "nix/{module,darwin-module}.nix"
      instructions: |
        The NixOS and nix-darwin modules. On NixOS the sudo rule must allow the
        configured user only the mount helper, nothing else (the darwin module has
        none). Flag new privileges, setuid wrappers or world-writable paths.
    - path: "tests/**"
      instructions: |
        Isolation checks should assert that something is refused, not only that
        the happy path works. Nothing may run on a live desktop session.
    - path: "helper/Cargo.toml"
      instructions: "Every dependency pinned (=x.y.z) and justified in a comment; `just audit` (cargo deny) must pass."
    - path: "**/*.md"
      instructions: "If behaviour changes, the pages in docs/ and a CHANGELOG line under Unreleased change in the same PR."
    - path: "**"
      instructions: "The repo is public: no host names, local paths, private repo names or personal data in code, docs or comments."

chat:
  auto_reply: true
