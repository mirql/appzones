[package]
name = "appzones-helper"
version = "0.11.0"
edition = "2021"
rust-version = "1.85"
description = "appzones' helpers in Rust: zone-init, open-link, zone-wayland and the mount helper (design/rust.md)"
license = "MIT"
repository = "https://github.com/mirql/appzones"
publish = false

# the helpers (static, see nix/helper.nix), and the root step on its own (glibc: NSS)
[[bin]]
name = "appzones-helper"
path = "src/main.rs"

[[bin]]
name = "appzones-mount-helper"
path = "src/mount_helper.rs"

[dependencies]
mirql-love-sparkle = "=0.7.1"
# zone-wayland: a Wayland client in pure Rust (no libwayland), and the protocol
wayland-client = "=0.31.15"
wayland-protocols = { version = "=0.32.13", features = ["client", "staging"] }
# the syscalls (prctl PDEATHSIG, pipe2)
rustix = { version = "=1.1.6", features = ["pipe", "process"] }
# the syscalls zone-init needs (fork-safe child setup, pty, signalfd, SCM_RIGHTS) and
# what rustix keeps experimental (the signal mask)
libc = "=0.2.191"
# zone-init's agent protocol (JSON lines)
serde_json = "=1.0.154"

[profile.release]
strip = true
lto = true
panic = "abort"
codegen-units = 1
opt-level = "s"
