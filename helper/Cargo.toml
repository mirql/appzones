[package]
name = "appzones-helper"
version = "0.12.0"
edition = "2021"
rust-version = "1.85"
description = "appzones: every command, the server, zone-init and zone-wayland in one binary, and the mount helper"
license = "MIT"
repository = "https://github.com/mirql/appzones"
publish = false

# appzones (static, see nix/helper.nix), and the root step on its own (glibc: NSS)
[[bin]]
name = "appzones-helper"
path = "src/main.rs"

[[bin]]
name = "appzones-mount-helper"
path = "src/mount_helper.rs"

[dependencies]
mirql-love-sparkle = "=0.7.1"
# zone-wayland: a Wayland client in pure Rust (no libwayland), and the protocol
wayland-client = "=0.31.15"
wayland-protocols = { version = "=0.32.13", features = ["client", "staging"] }
# the syscalls (prctl PDEATHSIG, pipe2)
rustix = { version = "=1.1.6", features = ["pipe", "process"] }
# the syscalls zone-init needs (fork-safe child setup, pty, signalfd, SCM_RIGHTS) and
# what rustix keeps experimental (the signal mask)
libc = "=0.2.191"
# zone-init's agent protocol (JSON lines)
serde_json = { version = "=1.0.154", features = ["preserve_order"] }
# zones.toml (stage 2): an untyped table in the file's own order, so errors come in the
# order Python's tomllib gives them
toml = { version = "=0.8.23", default-features = false, features = ["parse", "preserve_order"] }

[profile.release]
strip = true
lto = true
panic = "abort"
codegen-units = 1
opt-level = "s"
