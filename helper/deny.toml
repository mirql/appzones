# cargo deny check (just audit): the helper's dependencies, all pinned in Cargo.lock.
# Needs the network (the RustSec advisory database), so it is not a flake check.
[graph]
targets = ["x86_64-unknown-linux-gnu", "x86_64-unknown-linux-musl"]

[advisories]
yanked = "deny"

[licenses]
# permissive licenses only (appzones is MIT)
allow = ["MIT", "Apache-2.0", "Apache-2.0 WITH LLVM-exception", "Unicode-3.0", "Unlicense"]

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
