# The docs site: https://mirql.github.io/appzones/ (GitHub Pages builds it
# from this folder on main, with GitHub's own Jekyll: no workflow, no runner).
title: appzones
description: Long-lived sandboxes for your desktop apps, dev tools and AI agents on Linux.
url: https://mirql.github.io
baseurl: /appzones

remote_theme: just-the-docs/just-the-docs@v0.12.0
plugins:
  - jekyll-remote-theme
  # on by default on GitHub Pages; named here so a local build matches
  - jekyll-optional-front-matter
  - jekyll-relative-links

color_scheme: appzones # docs/_sass/color_schemes/appzones.scss
logo: /assets/images/appzones-dark.svg # assets/logo/wordmark.py writes it
favicon_ico: /assets/images/favicon.svg
search_enabled: true
heading_anchors: true
aux_links:
  GitHub: https://github.com/mirql/appzones
  Releases: https://github.com/mirql/appzones/releases
aux_links_new_tab: true
back_to_top: true
back_to_top_text: Back to top
footer_content: 'MIT licensed. <a href="https://github.com/mirql/appzones/security/advisories/new">Report a vulnerability</a> privately. This site counts visits with Google Analytics; the README on GitHub does not.'
gh_edit_link: true
gh_edit_link_text: Edit this page on GitHub
gh_edit_repository: https://github.com/mirql/appzones
gh_edit_branch: main
gh_edit_source: docs
gh_edit_view_mode: edit

# Pages keep no front matter (they read as plain markdown on GitHub): their
# titles and the sidebar come from here.
defaults:
  - scope:
      path: ""
    values:
      layout: default
  - scope:
      path: getting-started.md
    values:
      title: Getting started
      nav_order: 2
      has_children: true
      has_toc: false
  - scope:
      path: getting-started/install.md
    values:
      title: Install
      nav_order: 1
      parent: Getting started
  - scope:
      path: getting-started/first-zones.md
    values:
      title: First zones
      nav_order: 2
      parent: Getting started
  - scope:
      path: getting-started/upgrading.md
    values:
      title: Upgrading
      nav_order: 3
      parent: Getting started
  - scope:
      path: recipes.md
    values:
      title: Recipes
      nav_order: 3
  - scope:
      path: configuration.md
    values:
      title: Configuration
      nav_order: 4
      has_children: true
      has_toc: false
  - scope:
      path: configuration/reference.md
    values:
      title: Reference
      nav_order: 1
      parent: Configuration
  - scope:
      path: configuration/files.md
    values:
      title: Files and folders
      nav_order: 2
      parent: Configuration
  - scope:
      path: configuration/devices.md
    values:
      title: Devices and USB
      nav_order: 3
      parent: Configuration
  - scope:
      path: configuration/dbus.md
    values:
      title: D-Bus
      nav_order: 4
      parent: Configuration
  - scope:
      path: configuration/nix-ld.md
    values:
      title: Generic binaries
      nav_order: 5
      parent: Configuration
  - scope:
      path: configuration/projects.md
    values:
      title: Project zones
      nav_order: 6
      parent: Configuration
  - scope:
      path: desktop.md
    values:
      title: Desktop
      nav_order: 5
  - scope:
      path: troubleshooting.md
    values:
      title: Troubleshooting
      nav_order: 6
  - scope:
      path: how-it-works.md
    values:
      title: How it works
      nav_order: 7
  - scope:
      path: without-systemd.md
    values:
      title: Without systemd
      nav_order: 7.5
  - scope:
      path: security.md
    values:
      title: Security and limits
      nav_order: 8
  - scope:
      path: development.md
    values:
      title: Contributing
      nav_order: 9
  - scope:
      path: guide.md
    values:
      title: Guide
      nav_exclude: true

exclude:
  - "*.cast"
