name: Bug report
description: Something does not work as the docs say
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        **Security problems** (a way out of a zone, a never-list bypass, the mount helper): please do not open an issue.
        Use Security → Report a vulnerability instead (see SECURITY.md).
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you ran, what you expected, what happened instead.
    validations:
      required: true
  - type: textarea
    id: config
    attributes:
      label: zones.toml
      description: The zone (and app) involved. Remove anything private.
      render: toml
  - type: textarea
    id: output
    attributes:
      label: Output
      description: "`appzones check`, and `appzones logs ZONE` around the problem."
      render: text
  - type: input
    id: version
    attributes:
      label: appzones version
      description: "`appzones check` prints the release; the flake revision helps too."
    validations:
      required: true
  - type: input
    id: system
    attributes:
      label: System
      description: NixOS version, kernel (`uname -r`), compositor and version, GPU.
    validations:
      required: true
